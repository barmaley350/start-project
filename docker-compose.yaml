volumes:
  db-postgresql-data-volume:
    name: ${POSTGRESQL_DB_VOLUME_NAME:-db-volume}
  static-files-volume:
    name: ${STATIC_VOLUME_NAME:-static-volume}
  smtp4dev-volume:
    name: ${SMTP4DEV_VOLUME_NAME:-smtp4dev-volume}
  superset-volume:
    name:  ${SUPERSET_VOLUME_NAME:-superset-volume}

networks:
  internal-net:

services:
  # ----------------------------------------------------------------------------
  # nginx proxy server
  # ----------------------------------------------------------------------------
  service.nginx:
    build:
      context: .
      dockerfile: ./services/nginx/Dockerfile
    ports:
      - ${NGINX_PORT}:80 # <--- В .env файле измените NGINX_PORT на любой другой свободный порт. Например, 1340
    depends_on:
      - service.frontend
      - service.jupyter
    volumes:
      - static-files-volume:/usr/share/nginx/html/static
    restart: unless-stopped
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # nuxt frontend
  # ----------------------------------------------------------------------------
  service.frontend:
    build:
      context: .
      dockerfile: ./services/nuxtjs/Dockerfile
    command: "npm run dev"
    volumes:
      - ./services/nuxtjs:/app
    env_file:
      - ./services/nuxtjs/.env
    restart: unless-stopped
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # django drf backend
  # ----------------------------------------------------------------------------
  service.drf:
    build:
      context: .
      dockerfile: ./services/drf/Dockerfile
    expose:
      - 8000
    volumes:
      - ./services/drf:/app
      - static-files-volume:/app/static
    env_file:
      - ./services/drf/.env
    depends_on:
      - service.db_postgres
    restart: unless-stopped
    networks:
      - internal-net
    command: >
      sh -c "./run_before.sh
      && uv run gunicorn -c gunicorn.py settings.wsgi:application"

  # ----------------------------------------------------------------------------
  # fastapi backend
  # ----------------------------------------------------------------------------
  service.fastapi:
    build:
      context: .
      dockerfile: ./services/fastapi/Dockerfile
    expose:
      - 8000
    volumes:
      - ./services/fastapi:/app
    env_file:
      - ./services/fastapi/.env
    depends_on:
      - service.db_postgres
    restart: unless-stopped
    networks:
      - internal-net
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ----------------------------------------------------------------------------
  # database
  # ----------------------------------------------------------------------------
  service.db_postgres:
    image: postgres
    expose:
      - 5432
    volumes:
      - db-postgresql-data-volume:/var/lib/postgresql/18/docker
    env_file:
      - ./services/drf/.env
    restart: unless-stopped
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # adminer
  # ----------------------------------------------------------------------------
  service.adminer:
    image: adminer
    depends_on:
      - service.db_postgres
    expose:
      - 8080
    environment:
      ADMINER_DEFAULT_SERVER:  service.db_postgres
    restart: unless-stopped
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # jupyter
  # ----------------------------------------------------------------------------
  service.jupyter:
    build:
      context: .
      dockerfile: ./services/jupyter/Dockerfile
    expose:
      - 8888
    volumes:
      - ./services/drf/apps/jupyter/jupyter_files:/home/jovyan/work
    depends_on: 
      - service.db_postgres 
    restart: unless-stopped
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # apache superset
  # ----------------------------------------------------------------------------
  service.superset:
    build:
      context: .
      dockerfile: ./services/superset/Dockerfile
    ports:
      - 8088:8088
    expose:
      - 8088      
    volumes:
      - superset-volume:/app/superset_home
    # environment:
    #   - SUPERSET_APP_ROOT=/superset      
    # command: >
    #   bash -c "
    #     superset db upgrade &&
    #     superset init &&
    #     superset load_examples"    
    #     # superset run -h 0.0.0.0 -p 8088          
    depends_on: 
      - service.db_postgres 
    restart: unless-stopped
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # database
  # ----------------------------------------------------------------------------
  service.smtp4dev:
    image: rnwood/smtp4dev:prerelease
    expose:
      - 80
      - 110
      - 25
    environment:
      - ServerOptions__BasePath=/smtp4dev
    volumes:
      - smtp4dev-volume:/smtp4dev
    restart: unless-stopped
    networks:
      - internal-net      