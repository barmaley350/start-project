[project]
name = "DjangoDRF_API"
version = "0.1.0"
description = "Django/DRF API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.1",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.29.0",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.11",
    "pylint>=4.0.4",
    "pylint-django>=2.7.0",
    "python-dotenv>=1.2.1",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-django>=2.5",
]

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "django-debug-toolbar>=6.1.0",
    "django-extensions>=4.1",
    "factory-boy>=3.3.3",
    "faker>=40.1.2",
    "locust>=2.43.1",
    "pydot>=4.0.1",
    "pyparsing>=3.3.1",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "ruff>=0.14.11",
]

[tool.pytest]
#addopts = ["-vv", "-x", "--lf"]
addopts = ["-v", "-x", "--lf"]
testpaths = [
    "tests",
]
DJANGO_SETTINGS_MODULE = "settings.settings"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pre-commit-cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "venv",
    "__pycache",
    "**/migrations/*",
    "manage.py",
    "apps/jupyter/jupyter_files"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["S101", "D203", "D213", "COM812", "TD003", "TD004", "TD002", "FIX002"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Prefer single quotes over double quotes.
quote-style = "double"
